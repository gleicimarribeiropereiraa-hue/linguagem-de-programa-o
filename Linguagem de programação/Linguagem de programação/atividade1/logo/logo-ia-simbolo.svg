    <line x1="100" y1="100" x2="100" y2="22"/>
    <line x1="100" y1="100" x2="167.5" y2="139"/>
    <line x1="100" y1="100" x2="32.5" y2="139"/>
  </g>

  <!-- Nós -->
  <g fill="url(#g)">
