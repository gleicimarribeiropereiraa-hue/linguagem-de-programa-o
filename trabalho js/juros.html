<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">

    <title>Calculadora de juros</title>
    <link rel="stylesheet" href="style.css">
    <script src="juros.js" defer></script></head><body><header><h1>Calculadora de Juros</h1><p>Calcule o acréscimo sobre um valor</p></header><main><section class="card"><h2>Informe os dados</h2><form id="jurosForm"><label for="valor">Valor inicial (R$)</label><input id="valor" type="number" min="0" step="0.01" placeholder="Ex.: 1000,00" required><label for="percentual">Percentual de juros (%)</label><input id="percentual" type="number" min="0" step="0.01" placeholder="Ex.: 10" required><button type="submit">Calcular acréscimo</button></form><div id="resultado" class="result" aria-live="polite">O resultado será exibido aqui.</div><nav><a href="index.html">Início</a><a href="area.html">← Área de figuras</a></nav></section></main><footer>Atividade 3 — JavaScript</footer></body></html>
