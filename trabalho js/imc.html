<!DOCTYPE html>
<html lang="pt-BR">
  <head><meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
    <link rel="stylesheet" href="style.css">
    <script src="imc.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Sistema de Cálculo de IMC</h1>
      <p>Informe seu peso e sua altura</p>
    </header>
    <main>
      <section class="card">
        <h2>Calculadora</h2>
        <form id="imcForm">
          <label for="peso">Peso (kg)</label>
          <input id="peso" type="number" min="0.1" step="0.1" placeholder="Ex.: 70" required>
          <label for="altura">Altura (m)</label>
          <input id="altura" type="number" min="0.1" step="0.01" placeholder="Ex.: 1.75" required>
          <button type="submit">Calcular IMC</button>
        </form>
        <div id="resultado" class="result" aria-live="polite">O resultado será exibido aqui.</div>
        <p class="hint">O IMC é um indicador geral e não substitui uma avaliação profissional.</p>
        <nav>
          <a href="index.html">Início</a>
          <a href="area.html">Próxima atividade →</a>
        </nav>
      </section>
    </main>
    <footer>Atividade 1 — JavaScript</footer>
  </body>
</html>
